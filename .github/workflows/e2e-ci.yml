name: E2E CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          # Empty disposable service only; preparation switches TCP to SCRAM.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGCONNECT_TIMEOUT: '10'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Prepare disposable PostgreSQL 18 role
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: python .github/scripts/prepare-postgres.py
      - name: Verify authenticated database readiness
        run: psql -X -v ON_ERROR_STOP=1 -d postgres -c 'SELECT current_user, version();'
      - name: Restore backend
        run: dotnet restore SLES.slnx
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium and OS dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser and API E2E suite
        # Runner initializes schema/migration in a UUID database, waits for servers,
        # then terminates process groups and drops its database in finally.
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Upload failed Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 3
          if-no-files-found: warn
